<div class="alert alert-warning" *ngIf="lista.length<=0"><strong>Vazio!</strong>
    não existem produtos na vitrine!</div>

<div class="alerta-flutuante" *ngIf="mostrarAlerta">
    <div class="alerta-quadrado">
        <p>{{ mensagemAlerta }}</p>
    </div>
</div>

<div class="row g-3">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2" *ngFor="let obj of lista">
        <div class="card h-100">
            <img class="card-img-top" src="{{obj.codigo}}.jpg" alt="{{obj.nome}}"
                style="width:100%; aspect-ratio: 1/1; object-fit: cover;">

            <div class="card-body d-flex flex-column">
                <h4 class="card-title">{{obj.nome}}</h4>

                <p class="card-text" *ngIf="obj.promo > 0">
                    de: <s>R$ {{obj.valor | number:'1.2-2'}}</s><br>
                    por: R$ {{obj.promo | number:'1.2-2'}}
                </p>
                <p class="card-text" *ngIf="obj.promo <= 0">
                    por: R$ {{obj.valor | number:'1.2-2'}}
                </p>

                <span class="badge bg-danger mb-2 align-self-start" *ngIf="obj.quantidade <= 0">
                    Indisponível
                </span>

                <div class="mt-auto d-flex gap-2">
                    <a href="#" class="btn btn-primary" (click)="verDetalhe(obj); $event.preventDefault();">
                        Ver mais
                    </a>
                    <a href="#" class="btn btn-success" *ngIf="obj.quantidade > 0"
                        (click)="adicionarCesta(obj); $event.preventDefault();">
                        Comprar
                    </a>
                    <button class="btn btn-secondary" disabled *ngIf="obj.quantidade <= 0">
                        Comprar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
